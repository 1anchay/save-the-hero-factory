name: Save the Hero - Foundation CI and Preview

on:
  push:
    branches:
      - v0/foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate JSON and timing
        run: npm run validate

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Render technical preview
        run: npm run render:preview

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: save-the-hero-foundation-preview
          path: output/episode-001-preview.mp4
          if-no-files-found: error
          retention-days: 14
